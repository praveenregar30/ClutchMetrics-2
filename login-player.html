<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player sign-in: ClutchMetrics</title>
<meta name="description" content="The player sign-in for ClutchMetrics, which opens once the dashboards are built.">
<meta name="theme-color" content="#100e0c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --ink: #f7f1e8; --muted: #b4ab9e; --action: #ff7a1a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-content: center; gap: 16px; padding: 24px; background: #100e0c; color: var(--ink); font: 400 16px/1.6 "Host Grotesk", system-ui, sans-serif; }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -.03em; font-weight: 500; text-wrap: balance; }
  p { margin: 0; max-width: 46ch; }
  a { color: var(--action); text-underline-offset: 3px; display: inline-block; padding-block: 11px; touch-action: manipulation; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .brand { font-family: "Anton", Impact, "Arial Narrow", sans-serif; font-weight: 400; letter-spacing: .015em; font-size: 1.08em; }
</style>
<link rel="stylesheet" href="cursor.css">
</head>
<body>
<main>
  <h1>Player sign-in</h1>
  <p>This login opens your personal report. It goes live once the dashboards are built.</p>
  <a href="index.html">Back to <span class="brand" translate="no">ClutchMetrics</span></a>
</main>
</body>
</html>
